[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# Never attach production database credentials to pull-request previews.
# Main production deploys use secrets configured in the Netlify dashboard.
[context.deploy-preview]
  command = "node scripts/reject-preview.mjs"

[context.branch-deploy]
  command = "node scripts/reject-preview.mjs"
