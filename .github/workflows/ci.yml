name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: yung
          POSTGRES_PASSWORD: yung_test
          POSTGRES_DB: yung_event_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yung -d yung_event_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yung:yung_test@localhost:5432/yung_event_os_test
      TEST_DATABASE_URL: postgresql://yung:yung_test@localhost:5432/yung_event_os_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:e2e
